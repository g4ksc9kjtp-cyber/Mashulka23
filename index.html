<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💖 Порадуй Машульку</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Nunito',sans-serif;
      background:linear-gradient(135deg,#ffe5ef,#f1dcff,#e0ffe6);
      overflow-x:hidden;
      color:#444;
    }

    .flowers{position:fixed;inset:0;pointer-events:none;z-index:0;}
    .flower{position:absolute;font-size:28px;opacity:.15;animation:float 14s linear infinite;}

    [@keyframes] float{
      from{transform:translateY(110vh) rotate(0deg);}
      to{transform:translateY(-120px) rotate(360deg);}
    }

    .container{position:relative;z-index:2;max-width:1200px;margin:auto;padding:40px 20px;}

    .hero{text-align:center;margin-bottom:40px;}
    .hero h1{font-size:60px;color:#ff4fa3;}
    .hero p{color:#8e6bff;font-size:18px;}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .card{
      background:rgba(255,255,255,.8);
      backdrop-filter:blur(12px);
      border-radius:28px;
      padding:20px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
      transition:.3s;
    }

    .card:hover{transform:translateY(-8px);}

    .title{font-size:18px;font-weight:900;margin-bottom:15px;}

    .buttons{display:flex;gap:10px;flex-wrap:wrap;}

    .btn{
      border:none;
      border-radius:14px;
      padding:12px 16px;
      font-weight:800;
      cursor:pointer;
    }

    .open-btn{
      background:linear-gradient(135deg,#ff9ecf,#c084fc);
      color:white;
    }

    .reserve-btn{
      background:#22c55e;
      color:white;
    }

    .reserved{opacity:.6;}
    .reserved .title{text-decoration:line-through;}

    .note{
      margin-top:10px;
      font-size:13px;
      background:#22c55e;
      color:white;
      padding:6px 10px;
      border-radius:999px;
      display:inline-block;
    }

    .confetti{
      position:fixed;
      width:8px;height:8px;
      border-radius:50%;
      pointer-events:none;
      animation:fall 2s linear forwards;
    }

    [@keyframes] fall{
      to{transform:translateY(100vh) rotate(720deg);opacity:0;}
    }
  </style>
</head>

<body>

  <div class="flowers"></div>

  <div class="container">

    <div class="hero">
      <h1>💖 Порадуй Машульку</h1>
      <p>wishlist 🌸</p>
    </div>

    <div class="grid" id="wishlist"></div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      onSnapshot,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    // Твой Firebase конфиг
    const firebaseConfig = {
      apiKey: "AIzaSyAc5bAS5RCYWa71y_cKivRjOVkmAEd-O8M",
      authDomain: "mashulka-wishlist.firebaseapp.com",
      projectId: "mashulka-wishlist",
      storageBucket: "mashulka-wishlist.firebasestorage.app",
      messagingSenderId: "744583444002",
      appId: "1:744583444002:web:60c28d12cb25b17e39bc7b",
      measurementId: "G-58EBXKR8HG"
    };

    // Инициализация Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "wishlist", "main");

    // Твои товары
    const items = [
      { title: "Ozon подарок 1", url: "https://ozon.ru/t/hoMFXFt" },
      { title: "Ozon подарок 2", url: "https://ozon.ru/t/tKg1h4s" },
      { title: "Тренажер реформер для похудения и фитнеса доска для пилатеса", url: "https://www.wildberries.ru/catalog/461381491/detail.aspx?size=649380174" },
      { title: "Frudia крем гель для лица с черникой", url: "https://www.wildberries.ru/catalog/4728695/detail.aspx?size=17458763" },
      { title: "DHANA Cумка через плечо кросс-боди", url: "https://www.wildberries.ru/catalog/437368515/detail.aspx?size=620324431" },
      { title: "ANDA Набор косметичек 3 в 1 длясейна и путешествия", url: "https://www.wildberries.ru/catalog/540941374/detail.aspx?size=744928268" },
      { title: "The Act Скраб для тела антицеллюлитный", url: "https://www.wildberries.ru/catalog/18165016/detail.aspx?size=49612285" },
      { title: "The Act Набор для очищения лица", url: "https://www.wildberries.ru/catalog/441004027/detail.aspx?size=624634492" },
      { title: "LIBREDERM гиалуроновая вода", url: "https://www.wildberries.ru/catalog/35433151/detail.aspx?size=74259377" },
      { title: "LIBREDERM термальная вода", url: "https://www.wildberries.ru/catalog/42085435/detail.aspx?size=84349774" },
      { title: "Case by case Чехол AirPods", url: "https://www.wildberries.ru/catalog/168695511/detail.aspx?size=280375876" },
      { title: "STIMAXON степпер тренажёр", url: "https://www.wildberries.ru/catalog/663237871/detail.aspx?size=891628244" },
      { title: "О'кейси чехол AirPods", url: "https://www.wildberries.ru/catalog/374150254/detail.aspx?size=545919016" },
      { title: "Полотенца набор 3 шт", url: "https://www.wildberries.ru/catalog/721180244/detail.aspx?size=1015106787" },
      { title: "The Act масло для тела", url: "https://www.wildberries.ru/catalog/219651873/detail.aspx?size=349394222" },
      { title: "Кофе 3в1", url: "https://www.wildberries.ru/catalog/587590128/detail.aspx?size=802756593" }
    ];

    const root = document.getElementById("wishlist");

    // Состояние брони
    let reserved = {};

    // Подписка на изменения в Firestore (синхронизация)
    onSnapshot(docRef, (snap) => {
      reserved = snap.exists() ? snap.data() : {};
      render();
    });

    // Сохранение данных в Firestore
    async function save() {
      await setDoc(docRef, reserved);
    }

    // Переключение статуса брони
    async function toggle(i) {
      reserved[i] = !reserved[i];
      await save();
      confetti();
    }

    // Рендер карточек
    function render() {
      root.innerHTML = "";

      items.forEach((item, i) => {
        const is = reserved[i];

        const card = document.createElement("div");
        card.className = "card " + (is ? "reserved" : "");

        card.innerHTML = `
          <div class="title">${item.title}</div>

          <div class="buttons">
            <button class="btn open-btn" onclick="window.open('${item.url}','_blank')">
              Открыть 💖
            </button>

            <button class="btn reserve-btn" onclick="window.toggle(${i})">
              ${is ? "Занято 🎀" : "Я подарю 🎁"}
            </button>
          </div>

          ${is ? `<div class="note">Уже выбрано 💖</div>` : ""}
        `;

        root.appendChild(card);
      });
    }

    window.toggle = toggle;

    // Конфетти при брони
    function confetti() {
      for (let i = 0; i < 35; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.top = "-10px";
        c.style.background = `hsl(${Math.random() * 360},90%,70%)`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
      }
    }

    render();
  </script>

</body>
</html>
